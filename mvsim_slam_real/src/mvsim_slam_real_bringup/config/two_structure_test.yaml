tractor_parallel_parking_auto:
  ros__parameters:
    # Isolated test only. Existing parking.yaml / U-bay behavior is preserved.
    parking_side: left
    # Lateral parking depth. NEW GTR AMG body width is 0.55 m;
    # 1.10 m leaves 0.275 m on each side when aligned. Change before a run.
    slot_width: 1.10
    pair_min_gap_length: 2.60
    pair_max_gap_length: 6.0
    gap_min_lateral_m: 0.55
    pair_max_lateral_m: 6.0
    pair_min_longitudinal_m: -5.0
    pair_max_longitudinal_m: 35.0
    pair_max_heading_deg: 10.0
    pair_cluster_join_m: 0.10
    pair_min_structure_cells: 3
    pair_max_structure_extent_m: 3.0
    pair_interior_margin_m: 0.10
    pair_camera_match_distance_m: 0.20
    camera_evidence_lifetime_s: 180.0
    camera_stream_timeout_s: 1.0
    auto_execute: true
    execute_parking: true
    auto_detect_target: true
    enable_pose_freshness_stop: true
